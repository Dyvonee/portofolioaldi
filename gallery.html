<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri Kelas X-A | SMAN 1 Tarakan</title>
    <link rel="stylesheet" href="galeri-style.css">
</head>
<body>

    <!-- Tombol Kembali ke Portofolio -->
    <a href="port.html" class="back-btn">← Kembali</a>

    <header class="gallery-header">
        <h1>Galeri Kenangan Kelas X-A</h1>
        <p>Dokumentasi perjalanan dan keseruan siswa-siswi SMAN 1 Tarakan.</p>
    </header>


    <main class="gallery-container">

        <div class="gallery-item">
            <img src="maulid.jpg" alt="Kegiatan Kelas 1">
           
        </div>
   
        <div class="gallery-item">
            <img src="maulid3.jpg" alt="Kegiatan Kelas 2">
            
        </div>

        <div class="gallery-item">
            <img src="maulid2.jpg" alt="Kegiatan Kelas 3">
            
        </div>
       
        <div class="gallery-item">
            <img src="satu kelas.jpg" alt="Kegiatan Kelas 4">
         
        </div>
        
        <div class="gallery-item">
            <img src="foto1.jpg" alt="Kegiatan Kelas 5">
           
        </div>
       
        <div class="gallery-item">
            <img src="foto2.jpg" alt="Kegiatan Kelas 6">
            
        </div>
    </main>

 
    <div id="lightbox" class="lightbox">
        <span class="close-btn">&times;</span>
        <img class="lightbox-content" id="lightbox-img">
        <div id="caption"></div>
    </div>

    <script src="galeri-script.js"></script>
</body>
</html>
